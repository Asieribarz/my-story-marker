\* Modelo de entrega (V-25, architecture.md §3.4): 5 capítulos, 2 intentos,
\* 2 ciclos de revisión, 1 cambio del lector, dos ejecutores, caídas y
\* reanudación. Con AJ-3 y AJ-4, que es lo que implementa el código.
SPECIFICATION Spec
CONSTANTS
    NCap = 5
    TopeIntentos = 2
    TopeCiclos = 2
    MaxCambios = 1
    Ejecutores = {sesion, worker}
    MaxCaidas = 2
    MaxCaducidades = 1
    MaxReintentos = 1
    MaxCambiosPlan = 1
    MaxNotasFinal = 1
    MaxAfectados = 2
    SelloConGeneracion = TRUE
    GatesPorPasada = TRUE
INVARIANTS
    TypeOK
    Coherencia
    Inv2_SinDuplicados
    Inv2_ReanudarSinCoste
    Inv2_NoPierde
    Inv3_PublicadaCoherente
    Inv4_Topes
    Inv6_UnSoloEjecutor
PROPERTIES
    Inv1_PublicaVerificado
    Inv3_VersionAnterior
    Inv5_ParadaHumana
    Termina
    CambioTermina
